# Tests this package against its pinned SpaceAGORA commit with SpaceAGORA's
# reusable workflow. The ref after @, spaceagora-rev and the rev in
# SpaceAGORASource.toml are the same commit; change all three together.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spaceagora:
    uses: Space-FALCON-Lab/SpaceAGORA.jl/.github/workflows/contributor-ci.yml@bec28fcc348b48c6e807d007f9a5009e253e8340
    with:
      spaceagora-rev: "bec28fcc348b48c6e807d007f9a5009e253e8340"
      kind: package
      examples: examples/run_in_simulation.jl
