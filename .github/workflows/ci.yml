# Tests this package against its pinned SpaceAGORA commit with SpaceAGORA's
# reusable workflow. The ref after @, spaceagora-rev and the rev in
# SpaceAGORASource.toml are the same commit; change all three together.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spaceagora:
    uses: Space-FALCON-Lab/SpaceAGORA.jl/.github/workflows/contributor-ci.yml@0487e8226107592b19221618f0f21f500cf2aacf
    with:
      spaceagora-rev: "0487e8226107592b19221618f0f21f500cf2aacf"
      kind: package
      examples: examples/run_in_simulation.jl
